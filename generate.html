<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Timeline</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #181c27; --surface2: #1e2335;
    --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
    --text: #e8eaf0; --text-muted: #7a8099; --text-dim: #4a5068;
    --accent: #4f8ef7; --c-srs: #4f8ef7; --c-scb: #7c5cf6;
    --c-delay: #e85d4a; --c-done: #3dba7e; --c-warn: #f0a832;
    --header-h: 56px; --row-h: 42px; --label-w: 220px; --cell-w: 48px;
  }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 13px; min-height: 100vh; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; height: 52px; background: var(--surface);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .topbar-title { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
  .topbar-title span { color: var(--accent); }
  .topbar-right { display: flex; align-items: center; gap: 8px; }

  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 6px;
    font-size: 11px; font-weight: 500; letter-spacing: 0.3px; border: 1px solid;
  }
  .badge-srs  { background: rgba(79,142,247,0.12); color: var(--c-srs);  border-color: rgba(79,142,247,0.3); }
  .badge-scb  { background: rgba(124,92,246,0.12); color: var(--c-scb);  border-color: rgba(124,92,246,0.3); }
  .badge-delay{ background: rgba(232,93,74,0.12);  color: var(--c-delay); border-color: rgba(232,93,74,0.3); }
  .badge-done { background: rgba(61,186,126,0.12); color: var(--c-done); border-color: rgba(61,186,126,0.3); }
  .badge-warn { background: rgba(240,168,50,0.12); color: var(--c-warn); border-color: rgba(240,168,50,0.3); }

  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .toolbar label { font-size: 12px; color: var(--text-muted); }
  .toolbar select, .toolbar input[type=text], .toolbar input[type=number] {
    background: var(--bg); border: 1px solid var(--border2); color: var(--text);
    border-radius: 6px; padding: 5px 9px; font-size: 12px; font-family: inherit; outline: none;
  }
  .toolbar select:focus, .toolbar input:focus { border-color: var(--accent); }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 500;
    cursor: pointer; border: 1px solid var(--border2);
    background: transparent; color: var(--text); transition: background 0.15s;
  }
  .btn:hover { background: var(--surface2); }
  .btn-primary { background: var(--accent); border-color: transparent; color: #fff; }
  .btn-primary:hover { background: #3a7ae8; }
  .btn-danger { background: var(--c-delay); border-color: transparent; color: #fff; }
  .btn-danger:hover { background: #cf4030; }

  /* weekend toggle */
  .toggle-group { display: flex; border: 1px solid var(--border2); border-radius: 6px; overflow: hidden; }
  .toggle-group button {
    padding: 5px 12px; font-size: 12px; font-family: inherit; cursor: pointer;
    border: none; background: transparent; color: var(--text-muted);
    transition: background 0.12s, color 0.12s;
  }
  .toggle-group button.active { background: var(--accent); color: #fff; }
  .toggle-group button:not(:last-child) { border-right: 1px solid var(--border2); }

  .sep { width: 1px; height: 24px; background: var(--border2); }

  .label-col {
    flex-shrink: 0; width: var(--label-w); min-width: var(--label-w);
    position: sticky; left: 0; z-index: 20; background: var(--bg);
  }
  .label-col-header {
    height: calc(var(--header-h) * 2 + 1px);
    background: var(--surface);
    border-right: 1px solid var(--border2);
    border-bottom: 1px solid var(--border2);
    padding: 0;
    }
  .label-col-header p { font-size: 11px; color: var(--text-dim); }

  .label-row {
    height: var(--row-h); display: flex; align-items: center;
    padding: 0 12px; border-right: 1px solid var(--border2);
    border-bottom: 1px solid var(--border); background: var(--bg);
    gap: 8px; cursor: pointer; transition: background 0.12s;
  }
  .label-row:hover { background: var(--surface); }
  .label-row.group-row { background: var(--surface); font-weight: 500; font-size: 12px; }
  .label-row.group-row:hover { background: var(--surface2); }
  .label-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .label-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--text-muted); }
  .group-row .label-text { color: var(--text); }

  .grid-wrap { flex: 1; overflow: visible; }

  .month-header-row {
    display: flex; height: var(--header-h); border-bottom: 1px solid var(--border2);
    background: var(--surface); position: sticky; top: 52px; z-index: 15;
  }
  .month-cell {
    display: flex; align-items: center; justify-content: center;
    border-right: 1px solid var(--border2); font-size: 12px; font-weight: 600;
    letter-spacing: 0.5px; color: var(--text-muted); flex-shrink: 0; text-transform: uppercase;
  }
  .week-header-row {
    display: flex; height: var(--header-h); border-bottom: 1px solid var(--border2);
    background: var(--surface); position: sticky; top: calc(52px + var(--header-h)); z-index: 14;
  }
  .week-cell {
    flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-right: 1px solid var(--border); font-size: 10px; color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace; gap: 1px;
  }
  .week-cell .wnum { font-size: 11px; color: var(--text-muted); font-weight: 500; }
  .week-cell.today-col { background: rgba(79,142,247,0.06); }
  .week-cell.today-col .wnum { color: var(--accent); }
  .week-cell.weekend-col { background: rgba(255,255,255,0.02); }
  .week-cell.weekend-col .wnum { color: var(--text-dim); }

  .data-row { display: flex; height: var(--row-h); border-bottom: 1px solid var(--border); }
  .data-row:hover { background: rgba(255,255,255,0.02); }
  .data-row.group-row-grid { background: var(--surface); }

  .data-cell { flex-shrink: 0; border-right: 1px solid var(--border); position: relative; }
  .data-cell.today-col { background: rgba(79,142,247,0.04); }
  .data-cell.weekend-col { background: rgba(255,255,255,0.015); }

  .today-line {
    position: absolute; top: 0; bottom: 0; width: 2px;
    background: var(--c-delay); z-index: 5; pointer-events: none;
  }
  .today-line::before {
    content: 'TODAY'; position: absolute; top: 4px; left: 4px;
    font-size: 9px; color: var(--c-delay);
    font-family: 'IBM Plex Mono', monospace; font-weight: 500; white-space: nowrap;
  }
  .milestone-diamond {
    position: absolute; width: 10px; height: 10px;
    transform: rotate(45deg); background: var(--c-warn);
    top: 50%; margin-top: -5px; z-index: 4; cursor: pointer;
  }

  .legend {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 8px 24px; border-bottom: 1px solid var(--border);
  }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); }
  .legend-bar { width: 22px; height: 8px; border-radius: 3px; }
  .legend-diamond { width: 9px; height: 9px; transform: rotate(45deg); background: var(--c-warn); }
  .legend-weekend { width: 22px; height: 8px; border-radius: 3px; background: rgba(255,255,255,0.06); border: 1px solid var(--border2); }

  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 60px 24px; gap: 12px; color: var(--text-dim);
  }
  .empty-state svg { opacity: 0.3; }
  .empty-state p { font-size: 13px; }

  .modal-bg {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.6); z-index: 200;
    align-items: center; justify-content: center;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 12px; padding: 24px; width: 500px;
    max-width: 95vw; max-height: 90vh; overflow-y: auto;
  }
  .modal h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; }
  .form-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .form-row label { font-size: 11px; color: var(--text-muted); }
  .form-row input, .form-row select, .form-row textarea {
    background: var(--bg); border: 1px solid var(--border2); color: var(--text);
    border-radius: 6px; padding: 7px 10px; font-size: 13px; font-family: inherit; outline: none; width: 100%;
  }
  .form-row textarea { resize: vertical; min-height: 60px; }
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: var(--accent); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .btn-sm-danger {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 10px; border-radius: 5px; font-size: 11px; font-weight: 500;
    cursor: pointer; border: 1px solid rgba(232,93,74,0.4);
    background: rgba(232,93,74,0.1); color: var(--c-delay);
  }
  .btn-sm-danger:hover { background: rgba(232,93,74,0.2); }

  .swatch-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch {
    width: 24px; height: 24px; border-radius: 4px;
    cursor: pointer; border: 2px solid transparent; transition: transform 0.1s;
  }
  .swatch:hover { transform: scale(1.15); }
  .swatch.active { border-color: #fff; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <div class="topbar-title"><span id="timeline-year-display">2026</span> • <span id="project-title-display">Project Timeline</span></div>
  </div>
  <div class="topbar-right"></div>
</div>

<div class="toolbar">
  <label>ชื่อโปรเจกต์</label>
  <input type="text" id="project-title" value="My Project" style="width:160px"
    oninput="document.getElementById('project-title-display').textContent=this.value">

  <div class="sep"></div>

  <label>ปี</label>
  <input type="number" id="inp-year" value="2026" style="width:70px" min="2020" max="2035">
  <label>เดือนเริ่ม</label>
  <select id="inp-from">
    <option value="1">Jan</option><option value="2">Feb</option><option value="3">Mar</option>
    <option value="4">Apr</option><option value="5">May</option><option value="6">Jun</option>
    <option value="7">Jul</option><option value="8">Aug</option><option value="9">Sep</option>
    <option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option>
  </select>
  <label>ถึง</label>
  <select id="inp-to">
    <option value="1">Jan</option><option value="2">Feb</option><option value="3">Mar</option>
    <option value="4">Apr</option><option value="5">May</option><option value="6">Jun</option>
    <option value="7">Jul</option><option value="8">Aug</option><option value="9">Sep</option>
    <option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option>
  </select>

  <div class="sep"></div>

  <label>รวม Weekend</label>
  <div class="toggle-group">
    <button id="btn-wd-only" class="active" onclick="setWeekendMode('workday')">จ–ศ เท่านั้น</button>
    <button id="btn-wd-full" onclick="setWeekendMode('full')">รวม ส–อา</button>
  </div>

  <div class="sep"></div>

  <button class="btn btn-primary" onclick="renderGantt()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    Generate
  </button>
  <button class="btn" onclick="openAddTask()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    เพิ่ม Task
  </button>
  
  <button class="btn btn-danger" onclick="clearAllTasks()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
    Clear All
  </button>
  <button class="btn" onclick="window.print()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
    Print
  </button>
</div>

<div class="legend">
  <div id="legend-weekend" class="legend-item" style="display:none"><div class="legend-weekend"></div>Weekend (ส–อา)</div>
</div>

<div id="gantt-root" style="display:flex; overflow-x:auto;"></div>

<!-- ADD/EDIT TASK MODAL -->
<div class="modal-bg" id="modal-task">
  <div class="modal">
    <h3 id="modal-task-title">เพิ่ม Task ใหม่</h3>
    <input type="hidden" id="edit-task-id">
    <div class="form-row">
      <label>กลุ่ม (Group)</label>
      <input type="text" id="task-group" placeholder="เช่น Development, Testing" list="group-list">
      <datalist id="group-list"></datalist>
    </div>
    <div class="form-row">
      <label>ชื่อ Task</label>
      <input type="text" id="task-name" placeholder="เช่น Review SDS">
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label>วันเริ่มต้น</label>
        <input type="date" id="task-start">
      </div>
      <div class="form-row">
        <label>วันสิ้นสุด</label>
        <input type="date" id="task-end">
      </div>
    </div>
    <div class="form-row">
      <label>สี / ประเภท</label>
      <div class="swatch-row" id="color-swatches"></div>
    </div>
    <div class="form-row">
      <label>หมายเหตุ</label>
      <textarea id="task-note" placeholder="รายละเอียดเพิ่มเติม..."></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-sm-danger" id="btn-delete-task" onclick="deleteTask()" style="display:none;margin-right:auto">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        ลบ Task
      </button>
      <button class="btn" onclick="closeModal('modal-task')">ยกเลิก</button>
      <button class="btn btn-primary" onclick="saveTask()">บันทึก</button>
    </div>
  </div>
</div>


</div>

<script>
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const COLORS = {
  srs:'#4f8ef7', scb:'#7c5cf6', delay:'#e85d4a',
  done:'#3dba7e', warn:'#f0a832', pink:'#e05cb0', teal:'#27b5aa'
};
const COLOR_LABELS = { srs:'SRS', scb:'SCB', delay:'Delay', done:'Done', warn:'In Progress', pink:'Other', teal:'Support' };

let tasks = [];
let milestones = [];
let nextId = 1;
let selectedColor = 'srs';
let weekendMode = 'workday'; // 'workday' = Mon-Fri only | 'full' = Mon-Sun

function setWeekendMode(mode) {
  weekendMode = mode;
  document.getElementById('btn-wd-only').classList.toggle('active', mode === 'workday');
  document.getElementById('btn-wd-full').classList.toggle('active', mode === 'full');
  document.getElementById('legend-weekend').style.display = mode === 'full' ? 'flex' : 'none';
  renderGantt();
}

// ── date helpers ──
function startOfWeekMon(d) {
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  dt.setDate(dt.getDate() + diff);
  dt.setHours(0,0,0,0);
  return dt;
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function formatDate(d) { return d.toISOString().slice(0,10); }
function parseDate(s) { return new Date(s + 'T00:00:00'); }
function isWeekend(d) { const day = d.getDay(); return day === 0 || day === 6; }

// Build column list depending on weekendMode
// workday mode: each column = Mon week (Mon–Fri span, width = 5-day proportion)
// full mode:    each column = Mon week (Mon–Sun)
function buildColumns(year, mFrom, mTo) {
  const rangeStart = new Date(year, mFrom - 1, 1);
  const rangeEnd   = new Date(year, mTo, 0); // last day of mTo
  const cols = [];

  if (weekendMode === 'workday') {
    // columns are Mon-week blocks; weekend days just not shown but bar calc uses workday fraction
    let cur = startOfWeekMon(rangeStart);
    while (cur <= rangeEnd) {
      const monDate = new Date(cur);
      const friDate = addDays(cur, 4);
      cols.push({ type:'week', mon: monDate, fri: friDate, sun: addDays(cur,6) });
      cur = addDays(cur, 7);
    }
  } else {
    // full week Mon–Sun per column
    let cur = startOfWeekMon(rangeStart);
    while (cur <= rangeEnd) {
      const monDate = new Date(cur);
      cols.push({ type:'week', mon: monDate, fri: addDays(cur,4), sun: addDays(cur,6) });
      cur = addDays(cur, 7);
    }
  }
  return cols;
}

function colOf(dateStr, cols) {
  const d = parseDate(dateStr);
  const ws = formatDate(startOfWeekMon(d));
  const idx = cols.findIndex(c => formatDate(c.mon) === ws);
  if (idx >= 0) return idx;
  if (d < cols[0].mon) return 0;
  return cols.length - 1;
}

// ── render ──
function renderGantt() {
  const year  = +document.getElementById('inp-year').value;
  const mFrom = +document.getElementById('inp-from').value;
  const mTo   = +document.getElementById('inp-to').value;
  const yearDisplay = document.getElementById('timeline-year-display'); if(yearDisplay) yearDisplay.textContent = year;
  if (mFrom > mTo) { alert('เดือนเริ่มต้นต้องน้อยกว่าเดือนสิ้นสุด'); return; }

  const CELL = 52;
  const cols = buildColumns(year, mFrom, mTo);
  const todayStr = formatDate(new Date());

  // group tasks
  const groups = [];
  const groupMap = {};
  tasks.forEach(t => {
    if (!groupMap[t.group]) { groupMap[t.group] = { name:t.group, tasks:[] }; groups.push(groupMap[t.group]); }
    groupMap[t.group].tasks.push(t);
  });

  // month spans
  const monthSpans = [];
  cols.forEach((col, i) => {
    const m = col.mon.getMonth();
    if (!monthSpans.length || monthSpans[monthSpans.length-1].month !== m) {
      monthSpans.push({ month:m, start:i, count:1 });
    } else {
      monthSpans[monthSpans.length-1].count++;
    }
  });

  // update datalist
  const dl = document.getElementById('group-list');
  dl.innerHTML = '';
  groups.forEach(g => { const o = document.createElement('option'); o.value = g.name; dl.appendChild(o); });



  const totalW = cols.length * CELL;
  let html = `<div class="label-col">`;
  html += `<div class="label-col-header"></div>`;

  groups.forEach(g => {
    html += `<div class="label-row group-row" onclick="openAddTask('${g.name.replace(/'/g,"\\'")}')">
      <span class="label-text">${g.name}</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--text-dim)" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </div>`;
    g.tasks.forEach(t => {
      const dot = `<span class="label-dot" style="background:${COLORS[t.color]||COLORS.srs}"></span>`;
      html += `<div class="label-row" onclick="editTask(${t.id})">${dot}<span class="label-text">${t.name}</span></div>`;
    });
  });
  html += `</div>`;

  html += `<div class="grid-wrap" style="min-width:${totalW}px">`;

  // month header
  html += `<div class="month-header-row">`;
  monthSpans.forEach(ms => {
    html += `<div class="month-cell" style="width:${ms.count*CELL}px;flex-shrink:0">${MONTHS[ms.month]}</div>`;
  });
  html += `</div>`;

  // week header
  html += `<div class="week-header-row">`;
  cols.forEach((col, i) => {
    const ws = formatDate(col.mon);
    const we = formatDate(weekendMode === 'full' ? col.sun : col.fri);
    const isTodayCol = todayStr >= ws && todayStr <= we;
    const isWkndCol  = false; // week-level column is never purely weekend
    const d1 = col.mon.getDate();
    const d2 = (weekendMode === 'full' ? col.sun : col.fri).getDate();
    const wkLabel = weekendMode === 'full' ? `${d1}–${d2}` : `${d1}–${d2}`;
    html += `<div class="week-cell${isTodayCol?' today-col':''}" style="width:${CELL}px">
      <span class="wnum">W${i+1}</span>
      <span>${wkLabel}</span>
      ${weekendMode==='full'?`<span style="font-size:9px;color:var(--text-dim)">ส-อา</span>`:''}
    </div>`;
  });
  html += `</div>`;

  // data rows
  if (groups.length === 0) {
    html += `<div style="display:flex;align-items:center;justify-content:center;padding:48px 24px;color:var(--text-dim);font-size:13px;gap:8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
      ยังไม่มี Task — กด "เพิ่ม Task" เพื่อเริ่มต้น
    </div>`;
  }
  groups.forEach(g => {
    // group row
    html += `<div class="data-row group-row-grid">`;
    cols.forEach((col,i) => {
      const ws=formatDate(col.mon), we=formatDate(weekendMode==='full'?col.sun:col.fri);
      const isTodayCol = todayStr>=ws&&todayStr<=we;
      html += `<div class="data-cell${isTodayCol?' today-col':''}" style="width:${CELL}px"></div>`;
    });
    html += `</div>`;

    // task rows
    g.tasks.forEach(t => {
      html += `<div class="data-row" style="position:relative">`;
      cols.forEach((col,i) => {
        const ws=formatDate(col.mon), we=formatDate(weekendMode==='full'?col.sun:col.fri);
        const isTodayCol = todayStr>=ws&&todayStr<=we;
        html += `<div class="data-cell${isTodayCol?' today-col':''}" style="width:${CELL}px"></div>`;
      });

      // bar
      const c1 = colOf(t.start, cols);
      const c2 = colOf(t.end, cols);
      const barLeft = c1 * CELL + 2;
      const barW = Math.max(CELL - 4, (c2 - c1 + 1) * CELL - 4);
      const color = COLORS[t.color] || COLORS.srs;
      html += `<div style="position:absolute;top:9px;left:${barLeft}px;width:${barW}px;height:24px;
        background:${color};border-radius:4px;opacity:0.88;cursor:pointer;z-index:3;
        display:flex;align-items:center;padding:0 8px;overflow:hidden;
        font-size:10px;color:#fff;font-weight:500;white-space:nowrap;"
        title="${t.name}${t.note?'\n'+t.note:''}"
        onclick="editTask(${t.id})">${t.name}</div>`;

      // milestones
      milestones.filter(ms => ms.group === g.name).forEach(ms => {
        const mc = colOf(ms.date, cols);
        const mLeft = mc * CELL + CELL/2 - 5;
        html += `<div class="milestone-diamond" style="left:${mLeft}px" title="${ms.name}: ${ms.date}" onclick="editMilestone(${ms.id})"></div>`;
      });

      // today line
      const todayCo = colOf(todayStr, cols);
      if (todayCo >= 0 && todayCo < cols.length) {
        html += `<div class="today-line" style="left:${todayCo*CELL + CELL/2}px"></div>`;
      }

      html += `</div>`;
    });
  });

  html += `</div>`;
  document.getElementById('gantt-root').innerHTML = html;
}

// ── modals ──
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function buildSwatches() {
  const el = document.getElementById('color-swatches');
  el.innerHTML = '';
  Object.entries(COLORS).forEach(([k,v]) => {
    const d = document.createElement('div');
    d.className = 'swatch' + (k===selectedColor?' active':'');
    d.style.background = v;
    d.title = COLOR_LABELS[k];
    d.onclick = () => {
      selectedColor = k;
      document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
      d.classList.add('active');
    };
    el.appendChild(d);
  });
}

function openAddTask(group='') {
  document.getElementById('modal-task-title').textContent = 'เพิ่ม Task ใหม่';
  document.getElementById('edit-task-id').value = '';
  document.getElementById('btn-delete-task').style.display = 'none';
  document.getElementById('task-group').value = group;
  document.getElementById('task-name').value = '';
  document.getElementById('task-start').value = '';
  document.getElementById('task-end').value = '';
  document.getElementById('task-note').value = '';
  selectedColor = 'srs';
  buildSwatches();
  openModal('modal-task');
}

function editTask(id) {
  const t = tasks.find(x=>x.id===id);
  if (!t) return;
  document.getElementById('modal-task-title').textContent = 'แก้ไข Task';
  document.getElementById('edit-task-id').value = id;
  document.getElementById('btn-delete-task').style.display = 'inline-flex';
  document.getElementById('task-group').value = t.group;
  document.getElementById('task-name').value = t.name;
  document.getElementById('task-start').value = t.start;
  document.getElementById('task-end').value = t.end;
  document.getElementById('task-note').value = t.note||'';
  selectedColor = t.color;
  buildSwatches();
  openModal('modal-task');
}

function saveTask() {
  const id = document.getElementById('edit-task-id').value;
  const data = {
    group: document.getElementById('task-group').value.trim(),
    name:  document.getElementById('task-name').value.trim(),
    start: document.getElementById('task-start').value,
    end:   document.getElementById('task-end').value,
    color: selectedColor,
    note:  document.getElementById('task-note').value.trim(),
  };
  if (!data.name||!data.start||!data.end||!data.group) { alert('กรุณากรอกข้อมูลให้ครบ'); return; }
  if (data.start > data.end) { alert('วันเริ่มต้นต้องไม่เกินวันสิ้นสุด'); return; }
  if (id) {
    const t = tasks.find(x=>x.id===+id);
    Object.assign(t, data);
  } else {
    data.id = nextId++;
    tasks.push(data);
  }
  closeModal('modal-task');
  renderGantt();
}

function deleteTask() {
  const id = +document.getElementById('edit-task-id').value;
  if (!confirm('ลบ Task นี้หรือไม่?')) return;
  tasks = tasks.filter(x=>x.id!==id);
  closeModal('modal-task');
  renderGantt();
}

function openAddMilestone() {
  document.getElementById('edit-ms-id').value='';
  document.getElementById('btn-delete-ms').style.display='none';
  document.getElementById('ms-name').value='';
  document.getElementById('ms-date').value='';
  document.getElementById('ms-group').value='';
  openModal('modal-milestone');
}

function editMilestone(id) {
  const ms = milestones.find(x=>x.id===id);
  if (!ms) return;
  document.getElementById('edit-ms-id').value = id;
  document.getElementById('btn-delete-ms').style.display = 'inline-flex';
  document.getElementById('ms-name').value = ms.name;
  document.getElementById('ms-date').value = ms.date;
  document.getElementById('ms-group').value = ms.group;
  openModal('modal-milestone');
}

function saveMilestone() {
  const id = document.getElementById('edit-ms-id').value;
  const data = {
    name:  document.getElementById('ms-name').value.trim(),
    date:  document.getElementById('ms-date').value,
    group: document.getElementById('ms-group').value.trim(),
  };
  if (!data.name||!data.date) { alert('กรุณากรอกชื่อและวันที่'); return; }
  if (id) {
    const ms = milestones.find(x=>x.id===+id);
    Object.assign(ms, data);
  } else {
    data.id = nextId++;
    milestones.push(data);
  }
  closeModal('modal-milestone');
  renderGantt();
}

function deleteMilestone() {
  const id = +document.getElementById('edit-ms-id').value;
  if (!confirm('ลบ Milestone นี้หรือไม่?')) return;
  milestones = milestones.filter(x=>x.id!==id);
  closeModal('modal-milestone');
  renderGantt();
}

function clearAllTasks() {
  if (!confirm('ลบ Task และ Milestone ทั้งหมดหรือไม่?')) return;
  tasks = []; milestones = [];
  nextId = 1;
  renderGantt();
}

document.querySelectorAll('.modal-bg').forEach(bg => {
  bg.addEventListener('click', e => { if (e.target===bg) bg.classList.remove('open'); });
});

// set default month range: current month to +3
(function initDefaults() {
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth() + 1;
  document.getElementById('inp-year').value = y;
  document.getElementById('inp-from').value = m;
  document.getElementById('inp-to').value = Math.min(m + 3, 12);
})();

renderGantt();
</script>

    document.querySelectorAll('.modal-bg.open')
      .forEach(m => m.classList.remove('open'));
